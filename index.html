<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  height: 100vh;
  background: black;
  color: white;
  font-family: Arial, sans-serif;
  overflow: hidden;
  text-align: center;
}

/* Terrible PowerPoint intro */
#intro {
  position: fixed;
  inset: 0;
  background: black;
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 10;
  animation: disappear 3s forwards;
  animation-delay: 12s;
}

#intro h1 {
  font-size: 90px;
  animation:
    spin 2s,
    zoom 3s,
    shake 1s 5s,
    rainbow 2s infinite;
}

@keyframes spin {
  from {
    transform: rotate(720deg) scale(0);
  }
  to {
    transform: rotate(0deg) scale(1);
  }
}

@keyframes zoom {
  0%,100% {
    transform: scale(1);
  }
  50% {
    transform: scale(2);
  }
}

@keyframes shake {
  0%,100% { transform: translateX(0); }
  25% { transform: translateX(50px); }
  50% { transform: translateX(-50px); }
  75% { transform: translateX(50px); }
}

@keyframes rainbow {
  0% { color: red; }
  25% { color: yellow; }
  50% { color: lime; }
  75% { color: cyan; }
  100% { color: magenta; }
}

@keyframes disappear {
  0% {
    opacity: 1;
    transform: rotate(0deg);
  }
  100% {
    opacity: 0;
    transform: rotate(360deg) scale(0);
    pointer-events: none;
  }
}

h1 {
  font-size: 60px;
}

#score {
  font-size: 30px;
}

#charlie {
  position: absolute;
  padding: 20px 30px;
  background: white;
  color: black;
  border-radius: 15px;
  font-size: 25px;
  font-weight: bold;
  cursor: pointer;
}
</style>
